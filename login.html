<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Symo end-BEAR Connector</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Symo end-BEAR Connector</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="thongbao.html">Thông báo</a>
            <a href="banquyen.html">Bản quyền</a>
            <a href="quydinh.html">Quy định</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="card">
            <h2>Đăng nhập dành cho Symo</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="nhap-email@symo.com">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
            </form>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
