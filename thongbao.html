<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo chính thức - Symo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Symo end-BEAR Connector</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="thongbao.html" class="active">Thông báo</a>
            <a href="banquyen.html">Bản quyền</a>
            <a href="quydinh.html">Quy định</a>
            <a href="login.html" id="nav-login">Đăng nhập</a>
            <button id="nav-logout" onclick="logout()" style="display:none;" class="btn-danger">Đăng xuất</button>
        </nav>
    </header>

    <main class="container">
        <h2>Thông báo mới nhất</h2>

        <!-- Form tạo bài đăng (Chỉ hiện khi Symo đăng nhập) -->
        <div id="admin-post-panel" class="card" style="display: none;">
            <h3>Đăng thông báo mới (Quyền Symo)</h3>
            <form id="create-post-form">
                <input type="text" id="post-title" placeholder="Tiêu đề thông báo" required>
                <textarea id="post-content" rows="4" placeholder="Nội dung thông báo..." required></textarea>
                <button type="submit" class="btn-primary">Đăng bài</button>
            </form>
        </div>

        <!-- Danh sách bài đăng -->
        <div id="posts-list">
            <p>Đang tải thông báo...</p>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/thongbao.js"></script>
</body>
</html>
